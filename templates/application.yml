AWSTemplateFormatVersion: '2010-09-09'

Description: ALB, target groups, and S3 static bucket for the Photo Gallery application

Parameters:
  SubnetGroup1:
    Type: String
  SubnetGroup2:
    Type: String
  VpcId:
    Type: String

  ALBName:
    Type: String
    Default: photos-load-balancer

  ListenerPort:
    Type: Number
    Default: 80

  TestListenerPort:
    Type: Number
    Default: 8081

  TargetGroupName:
    Type: String
    Default: photos-target-group-blue

  GreenTargetGroupName:
    Type: String
    Default: photos-target-group-green

  TargetGroupPort:
    Type: Number
    Default: 8080

  StaticBucketName:
    Type: String
    Default: photo-gallery-dir

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref ALBName
      Scheme: internet-facing
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Subnets:
        - !Ref SubnetGroup1
        - !Ref SubnetGroup2

      Tags:
        - Key: Name
          Value: !Ref ALBName

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB Security Group
      GroupName: ALBSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref ListenerPort
          ToPort: !Ref ListenerPort
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: PhotoGalleryALBSecurityGroup
      VpcId: !Ref VpcId

  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref ListenerPort
      Protocol: HTTP

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn: ALBListener
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref GreenTargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: !Ref TestListenerPort
      Protocol: HTTP

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Name: !Ref TargetGroupName
      Port: !Ref TargetGroupPort
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: ALBTargetGroup
      TargetType: ip
      VpcId: !Ref VpcId

  GreenTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Name: !Ref GreenTargetGroupName
      Port: !Ref TargetGroupPort
      Protocol: HTTP
      Tags:
        - Key: Name
          Value: !Ref GreenTargetGroupName
      TargetType: ip
      VpcId: !Ref VpcId

  PhotoGalleryDirBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${StaticBucketName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Name
          Value: !Ref StaticBucketName

  StaticOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${StaticBucketName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  PhotoGalleryDirBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PhotoGalleryDirBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${PhotoGalleryDirBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${StaticCloudFrontDistribution}'

  StaticCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt PhotoGalleryDirBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt StaticOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
      Tags:
        - Key: Name
          Value: !Ref StaticBucketName

Outputs:
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
    Description: ALB Security Group ID

  ALBTargetGroupArn:
    Value: !Ref ALBTargetGroup
    Description: Blue target group ARN

  ALBListenerArn:
    Value: !Ref ALBListener
    Description: Production listener ARN

  TestListenerArn:
    Value: !Ref TestListener
    Description: Test listener ARN for CodeDeploy green validation

  BlueTargetGroupName:
    Value: !GetAtt ALBTargetGroup.TargetGroupName
    Description: Blue target group name

  GreenTargetGroupName:
    Value: !GetAtt GreenTargetGroup.TargetGroupName
    Description: Green target group name

  ALBDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Description: ALB DNS name — point your Route53 record here

  StaticBucketName:
    Value: !Ref PhotoGalleryDirBucket
    Description: S3 bucket name for static content

  StaticBucketArn:
    Value: !GetAtt PhotoGalleryDirBucket.Arn
    Description: S3 bucket ARN for static content

  StaticCloudFrontDomain:
    Value: !GetAtt StaticCloudFrontDistribution.DomainName
    Description: CloudFront domain for serving static content