name: Sync CloudFormation Templates to S3

on:
  push:
    branches:
      - main
    paths:
      - 'templates/**'

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ECR_ROLE }}
          aws-region: ${{ secrets.AWS_REGION}}

      - name: Upload changed templates to S3
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            DIFF_CMD="git diff-tree --no-commit-id -r --name-status $AFTER"
          else
            DIFF_CMD="git diff --name-status $BEFORE $AFTER"
          fi

          $DIFF_CMD -- 'templates/*.yml' 'templates/*.yaml' \
          | while read status file; do
              filename=$(basename "$file")
              if [ "$status" = "D" ]; then
                echo "Deleting s3://photo-gallery-templates/$filename"
                aws s3 rm "s3://photo-gallery-templates/$filename"
              else
                echo "Uploading $file -> s3://photo-gallery-templates/$filename"
                aws s3 cp "$file" "s3://photo-gallery-templates/$filename"
              fi
            done
